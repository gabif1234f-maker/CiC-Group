<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIC Group - Ingreso al Sistema</title>
  <style>
    /* --- ESTILOS DE LA PANTALLA DE LOGIN (INSPIRADO EN LA PLANTILLA) --- */
    :root {
      --primary: #2563eb;
      --bg-gradient: linear-gradient(135deg, #f472b6 0%, #60a5fa 100%); /* Degradado rosa/celeste de fondo */
      --dark: #0f172a;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
    }

    /* Tarjeta contenedor central */
    .login-card {
      background: white;
      width: 100%;
      max-width: 380px;
      padding: 40px 30px 30px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      position: relative;
      text-align: center;
    }

    /* Ícono redondo de Avatar Superior */
    .avatar-circle {
      width: 80px;
      height: 80px;
      background-color: var(--dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: white;
      position: absolute;
      top: -40px;
      left: calc(50% - 40px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    h2 { margin: 20px 0 25px 0; color: var(--dark); font-size: 22px; font-weight: 700; }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px 10px 34px; /* Espacio para el emoji */
      border: none;
      border-bottom: 2px solid #cbd5e1;
      font-size: 15px;
      color: #334155;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    /* Íconos minimalistas dentro de la casilla */
    .input-icon {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 16px;
      opacity: 0.5;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 25px;
    }

    .options-row label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

    .options-row a { color: #64748b; text-decoration: none; }
    .options-row a:hover { text-decoration: underline; }

    /* Botón de ingreso estirado minimalista */
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--dark);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
    }

    .btn-login:hover { background-color: var(--primary); }

    .error-msg {
      color: #ef4444; font-size: 13px; font-weight: bold; margin-top: 15px; display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Avatar circular superior -->
    <div class="avatar-circle">👤</div>
    
    <h2>CIC Group</h2>
    
    <form id="form-login" onsubmit="validarAcceso(event)">
      <div class="input-group">
        <label>Usuario / Email</label>
        <span class="input-icon">✉</span>
        <input type="text" id="login-user" placeholder="Escribí tu usuario" required autocomplete="off">
      </div>
      
      <div class="input-group">
        <label>Contraseña</label>
        <span class="input-icon">🔒</span>
        <input type="password" id="login-pass" placeholder="••••••••" required>
      </div>

      <div class="options-row">
        <label><input type="checkbox"> Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login">Login</button>
      
      <div id="msg-error" class="error-msg">⚠ Usuario o contraseña incorrectos</div>
    </form>
  </div>

   <script>
    // URL de tu base de datos (Asegurate de que coincida con la de tu index.html)
const FIREBASE_DB = "https://mi-web000-default-rtdb.firebaseio.com";

    /**
     * Valida el acceso consultando en tiempo real las cuentas creadas en Firebase
     */
    async function validarAcceso(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value.trim().toLowerCase();
      const p = document.getElementById('login-pass').value;
      const error = document.getElementById('msg-error');
      
      if(!u || !p) return;

      // 1. CLAVE MAESTRA ESTÁTICA PARA EL SUPERADMIN
      if (u === "superadmin" && p === "Gabriel.2024") {
        error.style.display = "none";
        localStorage.setItem("sesion_rol", "superadmin");
        localStorage.setItem("sesion_usuario", "Super Clave Maestra");
        window.location.href = "index.html";
        return;
      }

      // 2. VALIDACIÓN DINÁMICA CONTRA LOS USUARIOS DE FIREBASE
      try {
        const res = await fetch(`${FIREBASE_DB}/usuarios.json`);
        const usuarios = await res.json();
        
        let accesoConcedido = false;
        let nombreOperador = "";

        if (usuarios) {
          // Recorremos los usuarios en la base de datos
          Object.keys(usuarios).forEach(id => {
            const cuenta = usuarios[id];
            if (cuenta.usuario.toLowerCase() === u && cuenta.password === p) {
              accesoConcedido = true;
              nombreOperador = cuenta.nombre || cuenta.usuario;
            }
          });
        }

        if (accesoConcedido) {
          error.style.display = "none";
          localStorage.setItem("sesion_rol", "operador"); // Rol estándar
          localStorage.setItem("sesion_usuario", nombreOperador);
          window.location.href = "index.html";
        } else {
          error.style.display = "block"; // Datos incorrectos
        }
      } catch (err) {
        console.error("Error al conectar con el servidor de accesos:", err);
        alert("Error de red. No se pudo verificar las credenciales.");
      }
    }
  </script>


</body>
</html>
